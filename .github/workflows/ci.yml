name: Build Extension and Deploy Demo

on:
  push:
    branches:
      - master # Or your main branch

jobs:
  build_and_deploy: # Renamed job for clarity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Specify your node version
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Extension
        run: yarn build # This is: parcel build public/manifest.json --config @parcel/config-webextension ...

      - name: Archive Extension
        uses: actions/upload-artifact@v3
        with:
          name: extension-package
          path: public/dist/
          if-no-files-found: error

      - name: Build Demo Page
        run: yarn build -- --public-url /react-chrome-extension-template-side-panel/ # This is the original demo build command
      
      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v2
        with:
          target_branch: demo
          build_dir: public/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}